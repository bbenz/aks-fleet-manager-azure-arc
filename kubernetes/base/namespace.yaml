# Cloud-neutral namespace for the Online Boutique demo application.
#
# The `demo` label is the resourceSelector target used by
# kubernetes/fleet/cluster-resource-placement.yaml. Azure Kubernetes Fleet
# Manager propagates every resource in this namespace to whichever member
# clusters the ClusterResourcePlacement selects - do not remove this label.
apiVersion: v1
kind: Namespace
metadata:
  name: online-boutique
  labels:
    demo: fleet-arc-online-boutique
    app.kubernetes.io/part-of: online-boutique
    environment: demo
