# In-cluster smoke-test Job. scripts/08-validate-demo.ps1 applies this to each
# member cluster context, waits for completion, and reads its logs. It proves
# the shared workload is Available and functioning end-to-end (frontend HTTP
# reachable in-cluster, cartservice/redis round-trip) independent of whether
# the cloud's external LoadBalancer has finished provisioning yet - the
# external HTTP checks against the LB endpoints are done separately by the
# script using the Terraform/kubectl-reported external IP/hostname.
#
# Not part of kubernetes/base kustomization - deliberately applied/deleted
# per-run by scripts/08-validate-demo.ps1 (kubectl apply -f, then kubectl
# delete -f after reading logs), so it never becomes a permanent Fleet-placed
# resource and never gets swept up into the ClusterResourcePlacement's
# Namespace selector footprint tracking.
apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-arc-demo-smoke-test
  namespace: online-boutique
  labels:
    app: fleet-arc-demo-smoke-test
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: fleet-arc-demo-smoke-test
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: smoke-test
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          command:
            - sh
            - -c
            - |
              set -e
              echo "== Checking frontend Service (HTTP) =="
              wget -q -O- --timeout=10 http://frontend.online-boutique.svc.cluster.local:80/_healthz \
                && echo "frontend: OK" || (echo "frontend: FAILED"; exit 1)

              echo "== Checking redis-cart Service (TCP) =="
              nc -z -w 5 redis-cart.online-boutique.svc.cluster.local 6379 \
                && echo "redis-cart: OK" || (echo "redis-cart: FAILED"; exit 1)

              echo "== Checking cartservice Service (TCP, gRPC port) =="
              nc -z -w 5 cartservice.online-boutique.svc.cluster.local 7070 \
                && echo "cartservice: OK" || (echo "cartservice: FAILED"; exit 1)

              echo "All in-cluster smoke checks passed."
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
